# Настройки Codex для task-tracker-backend.
# Документация: https://learn.chatgpt.com/docs/config-file/config-basic
# Правила разработки и команды Gradle описаны в ../AGENTS.md.

# Разрешить изменение файлов рабочей области в рамках песочницы.
sandbox_mode = "workspace-write"

# Запрашивать расширение разрешений, когда оно необходимо для задачи.
approval_policy = "on-request"

# Использовать актуальный веб-поиск, в том числе для документации библиотек.
web_search = "live"

# Модель выбирается в клиенте Codex или в пользовательском config.toml.
# Здесь можно задать model и model_reasoning_effort при необходимости.
# MCP-серверы и настройки Windows задавайте в личной конфигурации:
# они зависят от установленного клиента и окружения.

# Task Git workflow events are configured in hooks.json.
[features]
hooks = true

# Official GitHub MCP; the token is supplied by the process environment, never stored here.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_MCP_TOKEN"
enabled_tools = ["get_me", "list_pull_requests", "pull_request_read", "create_pull_request", "update_pull_request"]
