spring.application.name=task-tracker-backend
server.port=8080
# Local development defaults match compose.dev.yaml; set JWT_SECRET in IDEA.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/task_tracker}
spring.datasource.username=${DB_USERNAME:task_tracker}
spring.datasource.password=${DB_PASSWORD:task_tracker_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
app.jwt.secret=${JWT_SECRET:5PHCmJTdFNTlrbvUJgG9z81HiLKgTcxKcI8aUdwdJgI=}
app.jwt.ttl=PT1H
app.email.publish-delay-ms=5000
